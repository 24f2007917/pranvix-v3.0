<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Pranvix AI</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif; }
    .admin-layout { display:flex;min-height:100vh; }
    .admin-sidebar { width:220px;background:var(--surface1);border-right:1px solid var(--border);
                     display:flex;flex-direction:column;padding:24px 0;flex-shrink:0; }
    .admin-logo { display:flex;align-items:center;gap:10px;padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px; }
    .admin-logo span { font-size:18px;font-weight:700;color:var(--text); }
    .nav-item { display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
                font-size:14px;color:var(--muted);transition:all .2s;border-left:3px solid transparent; }
    .nav-item:hover,.nav-item.active { color:var(--text);background:var(--surface2);border-left-color:var(--accent); }
    .admin-main { flex:1;overflow-y:auto;padding:28px; }
    .admin-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:24px; }
    .admin-header h1 { font-size:22px;font-weight:700; }
    .back-btn { background:none;border:1px solid var(--border);color:var(--muted);
                padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px; }
    .back-btn:hover { color:var(--text);border-color:var(--accent); }
    .stats-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px; }
    .stat-card { background:var(--surface1);border:1px solid var(--border);border-radius:14px;padding:20px; }
    .stat-card .sc-val { font-size:32px;font-weight:700;color:var(--accent); }
    .stat-card .sc-label { font-size:13px;color:var(--muted);margin-top:4px; }
    .section { background:var(--surface1);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px; }
    .section-title { font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px; }
    .user-table { width:100%;border-collapse:collapse; }
    .user-table th { text-align:left;padding:10px 12px;font-size:12px;color:var(--muted);
                     border-bottom:1px solid var(--border);font-weight:600; }
    .user-table td { padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle; }
    .user-table tr:last-child td { border-bottom:none; }
    .user-table tr:hover td { background:var(--surface2); }
    .badge { display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600; }
    .badge-active { background:rgba(34,197,94,.15);color:#22c55e; }
    .badge-banned { background:rgba(239,68,68,.15);color:#ef4444; }
    .badge-admin  { background:rgba(99,102,241,.15);color:var(--accent); }
    .action-btn { background:none;border:1px solid var(--border);color:var(--text);
                  padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;margin-right:4px;transition:all .2s; }
    .action-btn:hover { border-color:var(--accent);color:var(--accent); }
    .action-btn.danger:hover { border-color:#ef4444;color:#ef4444; }
    .page { display:none; }
    .page.active { display:block; }
    .chat-viewer { background:var(--surface2);border-radius:10px;padding:16px;max-height:420px;overflow-y:auto; }
    .cv-msg { margin-bottom:12px; }
    .cv-msg .cv-role { font-size:11px;color:var(--muted);margin-bottom:3px; }
    .cv-msg .cv-text { font-size:13px;line-height:1.5;background:var(--surface1);
                       padding:8px 12px;border-radius:8px;white-space:pre-wrap; }
    .loading-text { color:var(--muted);font-size:14px;text-align:center;padding:30px; }
    .uploads-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px; }
    .upload-card { background:var(--surface2);border-radius:10px;padding:12px;font-size:12px;text-align:center; }
    .upload-card img { width:100%;height:90px;object-fit:cover;border-radius:8px;margin-bottom:8px; }
    .upload-card .uc-name { overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text); }
    .upload-card .uc-user { color:var(--muted);margin-top:2px; }
    .search-bar { display:flex;gap:10px;margin-bottom:16px; }
    .search-bar input { flex:1;background:var(--surface2);border:1px solid var(--border);
                        color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px; }
    .chart-wrap { position:relative;height:220px; }
  </style>
</head>
<body>
<div class="admin-layout">

  <!-- Sidebar -->
  <nav class="admin-sidebar">
    <div class="admin-logo">
      <span>🛡 Admin</span>
    </div>
    <div class="nav-item active" onclick="showPage('dashboard', this)">📊 Dashboard</div>
    <div class="nav-item" onclick="showPage('users', this)">👥 Users</div>
    <div class="nav-item" onclick="showPage('chats', this)">💬 Chat History</div>
    <div class="nav-item" onclick="showPage('uploads', this)">🗂 File Uploads</div>
  </nav>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-header">
      <h1 id="page-title">📊 Dashboard</h1>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="admin-user-label" style="font-size:13px;color:var(--muted)"></span>
        <button class="back-btn" onclick="window.location.href='chatbot.html'">← Back to Chat</button>
        <button class="back-btn" onclick="doLogout()">Sign Out</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="page active" id="page-dashboard">
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="sc-val" id="stat-users">—</div><div class="sc-label">Total Users</div></div>
        <div class="stat-card"><div class="sc-val" id="stat-messages">—</div><div class="sc-label">Total Messages</div></div>
        <div class="stat-card"><div class="sc-val" id="stat-today">—</div><div class="sc-label">Messages Today</div></div>
        <div class="stat-card"><div class="sc-val" id="stat-uploads">—</div><div class="sc-label">File Uploads</div></div>
      </div>
      <div class="section">
        <div class="section-title">📈 Messages Per Day (Last 14 Days)</div>
        <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
      </div>
      <div class="section">
        <div class="section-title">👥 Users Over Time</div>
        <div class="chart-wrap"><canvas id="chart-users"></canvas></div>
      </div>
    </div>

    <!-- Users -->
    <div class="page" id="page-users">
      <div class="search-bar">
        <input type="text" id="user-search" placeholder="🔍 Search by name, email or username..." oninput="filterUsers()"/>
      </div>
      <div class="section">
        <div class="section-title">👥 All Users</div>
        <div id="users-table-wrap"><div class="loading-text">Loading users...</div></div>
      </div>
    </div>

    <!-- Chat History -->
    <div class="page" id="page-chats">
      <div class="section">
        <div class="section-title">💬 View User Chat History</div>
        <div id="user-select-wrap"><div class="loading-text">Loading users...</div></div>
        <div id="chat-sessions-wrap" style="margin-top:16px"></div>
        <div id="chat-messages-wrap" style="margin-top:16px"></div>
      </div>
    </div>

    <!-- Uploads -->
    <div class="page" id="page-uploads">
      <div class="section">
        <div class="section-title">🗂 All File Uploads</div>
        <div id="uploads-wrap"><div class="loading-text">Loading uploads...</div></div>
      </div>
    </div>
  </main>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

let allUsers = [];
let dailyChart, usersChart;

// ── Auth Guard (Admin only) ──────────────────────────────────
auth.onAuthStateChanged(async user => {
  if (!user) { window.location.href = 'login.html'; return; }
  if (user.email !== ADMIN_EMAIL) {
    alert('Access denied. Admin only.');
    window.location.href = 'chatbot.html';
    return;
  }
  document.getElementById('admin-user-label').textContent = user.email;
  loadDashboard();
  loadUsers();
});

function doLogout() { auth.signOut(); window.location.href = 'login.html'; }

// ── Page Navigation ──────────────────────────────────────────
function showPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  el.classList.add('active');
  const titles = { dashboard:'📊 Dashboard', users:'👥 Users', chats:'💬 Chat History', uploads:'🗂 File Uploads' };
  document.getElementById('page-title').textContent = titles[id];
  if (id === 'uploads') loadUploads();
  if (id === 'chats')   loadChatUserList();
}

// ── Dashboard ────────────────────────────────────────────────
async function loadDashboard() {
  const statsDoc = await db.collection('stats').doc('global').get();
  const stats    = statsDoc.exists ? statsDoc.data() : {};

  document.getElementById('stat-users').textContent    = stats.totalUsers    || 0;
  document.getElementById('stat-messages').textContent = stats.totalMessages || 0;

  const today = new Date().toISOString().split('T')[0];
  const daily = stats.daily || {};
  document.getElementById('stat-today').textContent   = daily[today] || 0;

  // Count uploads
  let uploadCount = 0;
  const usersSnap = await db.collection('uploads').get();
  for (const ud of usersSnap.docs) {
    const filesSnap = await db.collection('uploads').doc(ud.id).collection('files').get();
    uploadCount += filesSnap.size;
  }
  document.getElementById('stat-uploads').textContent = uploadCount;

  // Build last 14 days chart
  const labels = [], values = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000).toISOString().split('T')[0];
    labels.push(d.slice(5));
    values.push(daily[d] || 0);
  }
  renderChart('chart-daily', labels, values, 'Messages', '#6366f1');

  // Users over time (from user createdAt)
  const usersSnap2  = await db.collection('users').orderBy('createdAt', 'asc').get();
  const userLabels  = [], userCounts = [];
  let count = 0;
  usersSnap2.docs.forEach(d => {
    count++;
    const dt = (d.data().createdAt||'').split('T')[0];
    userLabels.push(dt ? dt.slice(5) : '?');
    userCounts.push(count);
  });
  if (userLabels.length) renderChart('chart-users', userLabels, userCounts, 'Total Users', '#22c55e');
}

function renderChart(id, labels, data, label, color) {
  const ctx = document.getElementById(id).getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{ label, data, borderColor: color, backgroundColor: color + '22',
                   tension: 0.4, fill: true, pointRadius: 3 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#888', font: { size: 11 } }, grid: { color: '#ffffff11' } },
        y: { ticks: { color: '#888', font: { size: 11 } }, grid: { color: '#ffffff11' }, beginAtZero: true }
      }
    }
  });
}

// ── Users ────────────────────────────────────────────────────
async function loadUsers() {
  const snap = await db.collection('users').orderBy('createdAt', 'desc').get();
  allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderUsersTable(allUsers);
  renderUserSelectForChats(allUsers);
}

function filterUsers() {
  const q = document.getElementById('user-search').value.toLowerCase();
  renderUsersTable(allUsers.filter(u =>
    (u.name||'').toLowerCase().includes(q) ||
    (u.email||'').toLowerCase().includes(q) ||
    (u.username||'').toLowerCase().includes(q)
  ));
}

function renderUsersTable(users) {
  const wrap = document.getElementById('users-table-wrap');
  if (!users.length) { wrap.innerHTML = '<div class="loading-text">No users found.</div>'; return; }
  let html = `<table class="user-table">
    <tr><th>Name</th><th>Email</th><th>Username</th><th>Joined</th><th>Messages</th><th>Status</th><th>Actions</th></tr>`;
  users.forEach(u => {
    const joined = u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-IN') : '—';
    const status = u.isAdmin  ? `<span class="badge badge-admin">Admin</span>` :
                   u.isBanned ? `<span class="badge badge-banned">Banned</span>` :
                                `<span class="badge badge-active">Active</span>`;
    const banBtn = u.isAdmin ? '' : u.isBanned
      ? `<button class="action-btn" onclick="unbanUser('${u.id}')">✅ Unban</button>`
      : `<button class="action-btn danger" onclick="banUser('${u.id}')">🚫 Ban</button>`;
    html += `<tr>
      <td>${u.name||'—'}</td>
      <td style="font-size:12px">${u.email||'—'}</td>
      <td>${u.username||'—'}</td>
      <td style="font-size:12px">${joined}</td>
      <td>${u.messageCount||0}</td>
      <td>${status}</td>
      <td>${banBtn}</td>
    </tr>`;
  });
  html += '</table>';
  wrap.innerHTML = html;
}

async function banUser(uid) {
  if (!confirm('Ban this user?')) return;
  await db.collection('users').doc(uid).update({ isBanned: true });
  await loadUsers();
}
async function unbanUser(uid) {
  await db.collection('users').doc(uid).update({ isBanned: false });
  await loadUsers();
}

// ── Chat History ─────────────────────────────────────────────
function renderUserSelectForChats(users) {
  const wrap = document.getElementById('user-select-wrap');
  let html = '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  users.filter(u => !u.isAdmin).forEach(u => {
    html += `<button class="action-btn" onclick="loadUserSessions('${u.id}', '${u.name||u.username}')">
      👤 ${u.name||u.username}
    </button>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function loadChatUserList() {
  if (allUsers.length) renderUserSelectForChats(allUsers);
}

async function loadUserSessions(uid, name) {
  const sessWrap = document.getElementById('chat-sessions-wrap');
  const msgWrap  = document.getElementById('chat-messages-wrap');
  msgWrap.innerHTML = '';
  sessWrap.innerHTML = `<div class="loading-text">Loading sessions for ${name}...</div>`;

  const snap = await db.collection('chats').doc(uid)
    .collection('sessions').orderBy('updatedAt','desc').get();

  if (snap.empty) { sessWrap.innerHTML = '<div class="loading-text">No chats found.</div>'; return; }

  let html = `<div class="section-title" style="margin-bottom:10px">💬 ${name}'s Sessions</div><div style="display:flex;gap:8px;flex-wrap:wrap">`;
  snap.docs.forEach(d => {
    html += `<button class="action-btn" onclick="loadSessionMessages('${uid}', '${d.id}', '${(d.data().title||'Chat').replace(/'/g,"\\'")}')">
      ${d.data().title || 'Chat'}
    </button>`;
  });
  html += '</div>';
  sessWrap.innerHTML = html;
}

async function loadSessionMessages(uid, sessionId, title) {
  const wrap = document.getElementById('chat-messages-wrap');
  wrap.innerHTML = `<div class="loading-text">Loading "${title}"...</div>`;

  const doc = await db.collection('chats').doc(uid)
    .collection('sessions').doc(sessionId).get();

  if (!doc.exists) { wrap.innerHTML = '<div class="loading-text">Session not found.</div>'; return; }

  const messages = doc.data().messages || [];
  let html = `<div class="section"><div class="section-title">💬 "${title}"</div><div class="chat-viewer">`;
  messages.forEach(m => {
    html += `<div class="cv-msg">
      <div class="cv-role">${m.role === 'user' ? '👤 User' : '🤖 Pranvix'} &bull; ${m.time ? new Date(m.time).toLocaleString('en-IN') : ''}</div>
      <div class="cv-text">${m.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>`;
  });
  html += '</div></div>';
  wrap.innerHTML = html;
}

// ── File Uploads ─────────────────────────────────────────────
async function loadUploads() {
  const wrap = document.getElementById('uploads-wrap');
  wrap.innerHTML = '<div class="loading-text">Loading uploads...</div>';
  const usersSnap = await db.collection('uploads').get();
  const all = [];
  for (const ud of usersSnap.docs) {
    const filesSnap = await db.collection('uploads').doc(ud.id).collection('files').orderBy('uploadedAt','desc').get();
    const userDoc   = await db.collection('users').doc(ud.id).get();
    const userName  = userDoc.exists ? (userDoc.data().name || userDoc.data().username || ud.id) : ud.id;
    filesSnap.docs.forEach(f => all.push({ ...f.data(), userName }));
  }
  if (!all.length) { wrap.innerHTML = '<div class="loading-text">No files uploaded yet.</div>'; return; }
  let html = '<div class="uploads-grid">';
  all.forEach(f => {
    html += `<div class="upload-card">`;
    if (f.type === 'image')
      html += `<a href="${f.url}" target="_blank"><img src="${f.url}" alt="${f.name}"/></a>`;
    else
      html += `<div style="height:90px;display:flex;align-items:center;justify-content:center;font-size:36px">📄</div>`;
    html += `<div class="uc-name"><a href="${f.url}" target="_blank" style="color:var(--accent)">${f.name}</a></div>
             <div class="uc-user">by ${f.userName}</div>
             <div class="uc-user">${f.uploadedAt ? new Date(f.uploadedAt).toLocaleDateString('en-IN') : ''}</div>
             </div>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}
</script>
</body>
</html>
