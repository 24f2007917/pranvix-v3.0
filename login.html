<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Pranvix AI</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <button class="theme-btn-auth" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <span class="logo-text">Pranvix</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in with your BBDU email</p>

    <div class="alert error"   id="alert-error"></div>
    <div class="alert success" id="alert-success"></div>

    <div class="form-group">
      <label for="email">BBDU Email</label>
      <input type="email" id="email" placeholder="yourname@bbdu.ac.in" autocomplete="off"/>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password"/>
    </div>

    <button class="btn" id="login-btn" onclick="handleLogin()">Sign In →</button>

    <div class="divider">or</div>
    <button class="btn btn-outline" onclick="window.location.href='register.html'">Create New Account</button>

    <div class="link-row">
      New here? <a href="register.html">Register for free</a>
    </div>

    <div class="support-bar">
      Need help? <a href="mailto:ujjwalsingh16072006@bbdu.ac.in">ujjwalsingh16072006@bbdu.ac.in</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    // Theme
    function applyTheme() {
      const t = localStorage.getItem('pranvix_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme() {
      const next = (localStorage.getItem('pranvix_theme') || 'dark') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('pranvix_theme', next);
      applyTheme();
    }
    applyTheme();

    // DO NOT use onAuthStateChanged here — it causes redirect loops.
    // Only redirect after explicit successful login below.

    function showAlert(id, type, msg) {
      const el = document.getElementById(id);
      el.className = `alert ${type}`;
      el.innerHTML = msg;
      el.style.display = 'block';
    }
    function hideAlerts() {
      document.getElementById('alert-error').style.display   = 'none';
      document.getElementById('alert-success').style.display = 'none';
    }
    function setLoading(on) {
      const btn = document.getElementById('login-btn');
      btn.textContent = on ? 'Signing in...' : 'Sign In →';
      btn.disabled = on;
    }

    async function handleLogin() {
      hideAlerts();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password)
        return showAlert('alert-error', 'error', '⚠️ Please fill in all fields.');

      if (!email.endsWith('@bbdu.ac.in'))
        return showAlert('alert-error', 'error', '🚫 Only <strong>@bbdu.ac.in</strong> emails allowed.');

      setLoading(true);
      try {
        // Set persistence to LOCAL before signing in
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        const cred = await auth.signInWithEmailAndPassword(email, password);

        // Check if banned
        const userDoc = await db.collection('users').doc(cred.user.uid).get();
        if (userDoc.exists && userDoc.data().isBanned) {
          await auth.signOut();
          return showAlert('alert-error', 'error', '🚫 Your account has been banned.');
        }

        // Update lastLogin
        await db.collection('users').doc(cred.user.uid).update({ lastLogin: new Date().toISOString() });

        // Small delay to let Firebase persist the session to localStorage
        await new Promise(r => setTimeout(r, 300));

        window.location.href = 'chatbot.html';
      } catch (err) {
        const msg = err.code === 'auth/user-not-found'     ? '❌ No account with this email.'
                  : err.code === 'auth/wrong-password'     ? '❌ Incorrect password.'
                  : err.code === 'auth/invalid-credential' ? '❌ Invalid email or password.'
                  : err.code === 'auth/too-many-requests'  ? '⚠️ Too many attempts. Try again later.'
                  : `❌ ${err.message}`;
        showAlert('alert-error', 'error', msg);
      } finally { setLoading(false); }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
  </script>
</body>
</html>
